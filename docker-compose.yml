version: "3.9"

# NoticeVault — local development services
# Start: docker compose up -d
# Stop:  docker compose down
# Logs:  docker compose logs -f

services:
  postgres:
    image: postgres:18-alpine
    container_name: noticevault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noticevault
      POSTGRES_PASSWORD: noticevault_dev
      POSTGRES_DB: noticevault_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticevault -d noticevault_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: noticevault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
